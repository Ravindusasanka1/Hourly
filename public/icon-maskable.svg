<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-maskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="ring-maskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Full bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bg-maskable)" />
  
  <!-- Outer Stopwatch / Timer Ring scaled inside safe area -->
  <circle cx="256" cy="275" r="115" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="20" />
  <circle cx="256" cy="275" r="115" fill="none" stroke="url(#ring-maskable)" stroke-width="20" stroke-linecap="round" stroke-dasharray="722" stroke-dashoffset="210" transform="rotate(-90 256 275)" />
  
  <!-- Top button of stopwatch -->
  <rect x="238" y="118" width="36" height="24" rx="6" fill="#ffffff" />
  <rect x="224" y="104" width="64" height="16" rx="5" fill="#e0e7ff" />
  
  <!-- Center Hands -->
  <circle cx="256" cy="275" r="14" fill="#ffffff" />
  <line x1="256" y1="275" x2="256" y2="195" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="275" x2="315" y2="275" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
</svg>
